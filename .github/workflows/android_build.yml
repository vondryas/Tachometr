name: Android Build & Release

on:
  push:
    tags:
      - 'v*.*' # Reaguje na tagy jako v1.0, v1.0.1, v2.4 atd.
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Povolení, aby Action mohla upravovat Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Extract Version from Tag
        id: version
        run: |
          # Získá samotný název tagu bez "refs/tags/" a bez písmene "v" (např. z "refs/tags/v1.2.3" udělá "1.2.3")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/v}
          else
            TAG_NAME="1.0-dev"
          fi
          echo "APP_VERSION_NAME=$TAG_NAME" >> $GITHUB_ENV
          
          # Jako versionCode použijeme číslo běhu z GitHub Actions (vždy se zvyšuje)
          echo "APP_VERSION_CODE=$GITHUB_RUN_NUMBER" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          echo "MAPS_API_KEY=$MAPS_API_KEY" > local.properties

      - name: Build Release APK
        # Předáváme verzi do gradle přes parametry -P
        run: ./gradlew :androidApp:assembleRelease -PAPP_VERSION_NAME="${{ env.APP_VERSION_NAME }}" -PAPP_VERSION_CODE="${{ env.APP_VERSION_CODE }}"

      - name: Rename APK
        run: |
          mv androidApp/build/outputs/apk/release/androidApp-release.apk Tachometr-Android-v${{ env.APP_VERSION_NAME }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tachometr-Android-v${{ env.APP_VERSION_NAME }}
          path: Tachometr-Android-v${{ env.APP_VERSION_NAME }}.apk

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Tachometr-Android-v${{ env.APP_VERSION_NAME }}.apk
