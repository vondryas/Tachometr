name: iOS Build (Sideloading IPA)

on:
  push:
    tags:
      - 'v*.*.*' # Spustí se při vytvoření nového tagu (např. v1.0.1)
  workflow_dispatch: # Možnost spustit ručně z GitHubu

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App (Unsigned)
        run: |
          cd iosApp
          # Kompilace Xcode projektu bez nutnosti placeného vývojářského certifikátu
          xcodebuild clean archive \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA for Sideloading
        run: |
          cd iosApp
          mkdir -p Payload
          # Přesuneme zkompilovanou .app složku do složky Payload (standardní formát pro IPA)
          mv build/iosApp.xcarchive/Products/Applications/iosApp.app Payload/
          # Zabalíme to jako ZIP, ale s příponou .ipa
          zip -r ../Tachometr-iOS-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tachometr-iOS-Unsigned
          path: Tachometr-iOS-Unsigned.ipa

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Tachometr-iOS-Unsigned.ipa
