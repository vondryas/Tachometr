name: iOS Build (Sideloading IPA)

on:
  push:
    tags:
      - 'v*.*.*' # Spustí se při vytvoření nového tagu (např. v1.0.1)
  workflow_dispatch: # Možnost spustit ručně z GitHubu

jobs:
  build-ios:
    name: Build iOS & Run Tests
    runs-on: macos-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Shared Multiplatform Tests (iOS & Android Logic)
        # Toto spustí naše napsané testy (GpsProcessorTest) v iOS simulátor prostředí i na JVM
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App (Device IPA - Unsigned)
        run: |
          cd iosApp
          xcodebuild clean archive \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Device IPA
        run: |
          cd iosApp
          mkdir -p Payload
          cp -r build/iosApp.xcarchive/Products/Applications/iosApp.app Payload/
          zip -r ../Tachometr-iOS-Unsigned.ipa Payload
          rm -rf Payload

      - name: Build iOS App (Simulator .app for web testing)
        run: |
          cd iosApp
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build/simulator \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          
          cd build/simulator/Build/Products/Debug-iphonesimulator
          zip -r ../../../../../../Tachometr-iOS-Simulator.zip iosApp.app

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tachometr-iOS-Unsigned
          path: Tachometr-iOS-Unsigned.ipa

      - name: Upload Simulator Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tachometr-iOS-Simulator
          path: Tachometr-iOS-Simulator.zip

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Tachometr-iOS-Unsigned.ipa
            Tachometr-iOS-Simulator.zip
